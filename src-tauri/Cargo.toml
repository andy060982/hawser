[package]
name = "hawser"
version = "0.5.0-beta.1"
description = "SSH and SFTP client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hawser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust SSH. No libssh2/OpenSSL system dependency, so the Windows build
# needs no vcpkg and CI stays reproducible. Pinned to the 0.54 line rather than
# an exact patch: 0.54.6 requires libcrux-ml-kem 0.0.3, which is yanked.
# default features pull aws-lc-rs, whose build script requires NASM on Windows.
# "ring" is the pure-Rust alternative: no NASM, no C toolchain beyond MSVC,
# and it keeps CI reproducible. Drop "rsa" and older servers stop working.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.0"
# Direct dep only to turn on ssh-key's `getrandom` feature (SysRng), used by the
# in-app Ed25519 keygen. Version-matched to what russh pulls so features unify
# rather than duplicating the crate.
ssh-key = { version = "0.7.0-rc.11", features = ["getrandom"] }
tokio = { version = "1.53.1", features = ["full"] }
zeroize = "1.8.2"
dashmap = "6.2.1"
# SHA-256 for the tamper-evident audit-log hash chain (utils::audit). Already in
# the dependency tree transitively, so naming it here adds no new download.
sha2 = "0.10"
thiserror = "2.0.20"
similar = "2.7.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "rustls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
portable-pty = "0.9"

# --- Platform credential vaults -------------------------------------------
# Windows: hand-rolled Credential Manager access (see src/credentials.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

# Linux: freedesktop Secret Service over pure-Rust D-Bus (zbus), no system
# libdbus needed to build; crypto-rust keeps the encrypted session pure-Rust too.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

# macOS: native Keychain, no extra system libraries.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[profile.release]
# Size-first, because a desktop SSH client is latency-bound on the network, not
# on local CPU.
opt-level = "s"     # "z" trades loop vectorisation for a little more size
                    # reduction. Not benchmarked here — if you switch, measure
                    # the SFTP copy loop before keeping it.
lto = "fat"         # explicit; `true` means "fat" but reads ambiguously
codegen-units = 1   # one unit = best cross-function inlining, slowest builds
strip = true        # drops symbols; see the caveat below
panic = "abort"     # no unwinding tables, no landing pads

# CAVEAT, and it matters for this application specifically:
#
# `panic = "abort"` turns a panic in ANY task into immediate process death. The
# SSH output pump and each transfer run in spawned tokio tasks; with unwinding,
# a panic there kills one task and the app survives with a dead session. With
# abort, one malformed packet takes down every other open connection too.
#
# That trade is acceptable only because the alternative — a half-initialised
# session silently continuing — is worse for a tool that writes to production
# network gear. Keep panics genuinely unreachable in the pump path, and prefer
# returning SshError over unwrap() anywhere near protocol parsing.
#
# `strip = true` also means release crash dumps have no symbols. For an internal
# build you want to debug, use the profile below instead: same optimisation,
# symbols retained.

[profile.release-debug]
inherits = "release"
strip = false
debug = 1

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
